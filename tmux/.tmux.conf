# ── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1              # windows start at 1
set -g pane-base-index 1         # panes start at 1
set -gw automatic-rename on
set -g renumber-windows on       # reorder windows when one is closed
set -g history-limit 10000
set -g mouse on
set -sg escape-time 0            # no delay for escape key (important for nvim)
set -g focus-events on           # lets nvim autoread work

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Splits ────────────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (vim-style) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing ─────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ─────────────────────────────────────────────────────────
bind -r [ previous-window
bind -r ] next-window

# ── Copy mode (vim keys) ──────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Sessions ───────────────────────────────────────────────────────────────────
bind -n C-f run-shell "tmux neww tmux-sessionizer"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1a1a1a fg=#bebebe"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#e68e0d,fg=#121212,bold] #S #[bg=#1a1a1a,fg=#e68e0d]  "

# Right: time and date
set -g status-right-length 60
set -g status-right "#[fg=#8a8a8d] %a %d %b #[fg=#bebebe,bold] %H:%M "

# Window list (center)
set -g status-justify left
set -g window-status-format " #[fg=#8a8a8d]#I:#W "
set -g window-status-current-format " #[fg=#ffc107,bold]#I:#W "

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#e68e0d"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'

