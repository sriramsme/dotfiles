"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$directory$git_branch$git_status$cmd_duration$status$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"

[git_branch]
format = "[$symbol$branch]($style)"
symbol = " "
style = "bold yellow"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bold red"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "~"
staged = "+"
deleted = "-"

[cmd_duration]
min_time = 2_000
format = "[${duration}]($style)"
style = "dimmed white"

[status]
disabled = false
format = '[$status]($style)'
style = "bold red"
success_symbol = ""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true
